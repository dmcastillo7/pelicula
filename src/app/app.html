<div class="container">

  <h1>Catálogo de Películas</h1>

  <div class="contenedor">

    <!-- Recorremos la lista de películas dinámicamente -->
    @for (pelicula of peliculas; track pelicula.nombre) {
      <!-- El Padre envía los datos usando los corchetes [datosPelicula] hacia el @Input del Hijo -->
      <app-pelicula [datosPelicula]="pelicula"></app-pelicula>
    }

  </div>

</div>
