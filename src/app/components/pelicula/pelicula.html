<div class="tarjeta">
  <!-- Se remplaza la URL estática por la propiedad de la imagen- Dayra Mosquera -->
  <img [src]="datosPelicula.imagen" alt="Portada de {{ datosPelicula.nombre }}">

  <!-- Reemplazo los textos fijos usando interpolación {{ }} Dayra Mosquera-->
  <h2>{{ datosPelicula.nombre }}</h2>

  <p>{{ datosPelicula.genero }}</p>

  <p>{{ datosPelicula.anio }}</p>

  <button>
    Ver Película
  </button>
</div>
